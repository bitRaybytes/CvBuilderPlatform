spring.application.name=cv-builderplatform

# Postgres in docker container
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# local test environment
#spring.datasource.url=jdbc:postgresql://localhost:5432/cvbuilder
#spring.datasource.username=postgres
#spring.datasource.password=postgres

# ddl-auto=create initializes a new db at every start. You can change it to 'update', if you wish to persist your data.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# For debug purposes; can be commented
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG

jwt.secret=${JWT_SECRET}
# expiration set to 15 minutes; can be customized
jwt.expiration=900000


# App uploads
app.upload.path=/app/uploads